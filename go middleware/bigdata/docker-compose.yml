name: traffic-bigdata

# Shared Hadoop config. The apache/hadoop image converts FILE.XML_key env vars
# into real XML config files at container start.
x-hadoop-env: &hadoop-env
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  HDFS-SITE.XML_dfs.replication: "1"                  # one datanode -> replication 1
  HDFS-SITE.XML_dfs.permissions.enabled: "false"      # dev only: skip HDFS ACL headaches
  HDFS-SITE.XML_dfs.namenode.name.dir: /hadoop/dfs/name
  HDFS-SITE.XML_dfs.datanode.data.dir: /hadoop/dfs/data
  HDFS-SITE.XML_dfs.namenode.safemode.extension: "0"  # leave safe mode immediately
  HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
  HADOOP_HEAPSIZE_MAX: 512m

services:
  # ───────────── Kafka (KRaft: broker + controller in one node) ─────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "29092:29092"          # host access (gateway, simulator)
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      # What clients are told to reconnect to:
      #  - containers -> kafka:9092, host -> localhost:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker -> internal topics must use replication factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topic is created by our script
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ───────────── HDFS ─────────────
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    user: root                 # avoids volume-permission problems on Docker Desktop
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"            # NameNode web UI
    environment:
      <<: *hadoop-env
      # The image formats the namenode only if this path does NOT exist.
      # The volume is mounted one level up (/hadoop/dfs) so "name" is absent on first run.
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name
    volumes:
      - namenode-data:/hadoop/dfs
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 40s

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    environment: *hadoop-env
    volumes:
      - datanode-data:/hadoop/dfs
    depends_on:
      namenode:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9864'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot job: creates HDFS dirs, then exits (exit code 0 = success)
  hdfs-init:
    image: apache/hadoop:3.3.6
    container_name: hdfs-init
    user: root
    restart: "no"
    environment: *hadoop-env
    depends_on:
      namenode:
        condition: service_started
      datanode:
        condition: service_started
    command:
      - bash
      - -c
      - |
        hdfs dfs -mkdir -p /traffic/raw /spark/checkpoints &&
        hdfs dfs -chmod -R 777 /traffic /spark &&
        echo "HDFS-INIT-OK"

  # ───────────── Spark (standalone cluster) ─────────────
  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"            # Master UI
      - "7077:7077"
    volumes:
      - ./spark/jobs:/opt/spark-jobs:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  spark-worker:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "2", "--memory", "1g",
              "--webui-port", "8081"]
    ports:
      - "8081:8081"            # Worker UI
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ───────────── Redis (single node for local dev) ─────────────
  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  kafka-data:
  namenode-data:
  datanode-data:
  redis-data: